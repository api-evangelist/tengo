name: Tengo
description: Tengo is an AI-powered public procurement platform that helps companies find,
  evaluate, and respond to public tenders in one place. Founded in 2023 in France by Hugues
  Renou and Yoann Gauthier, Tengo covers the full tender lifecycle — sourcing and targeting
  relevant opportunities, drafting and writing proposals with AI, and managing responses and
  performance analytics — serving SMEs, mid-sized companies, and large corporations. Tengo
  raised a €3M round led by Point Nine in 2024. It operates a business-user SaaS with a
  request-a-demo onboarding and no public developer API surface.
